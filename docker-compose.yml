version: "3"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.backend
    container_name: server
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/auth
    depends_on:
      - mongo

  mongo:
    container_name: mongo
    image: mongo
    volumes:
      - ./data/db:/data/db
      - ./data/configdb:/data/configdb
    ports:
      - "27017:27017"
