name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install sshpass
        run: sudo apt-get install sshpass

      - name: Deploy to VPS
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          MONGO_USERNAME: ${{ secrets.MONGO_USERNAME }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no root@***REMOVED*** '
            cd /var/www/StickifyMe && 
            git config core.sshCommand "ssh -i /root/.ssh/id_ed25519 -F /dev/null" &&
            git pull origin master && 
            docker-compose down --volumes --remove-orphans &&
            docker system prune -a &&

            # Create a temporary .env file
            echo "MONGO_USERNAME=${{ secrets.MONGO_USERNAME }}" > .env
            echo "MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}" >> .env
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env

            # # Use the .env file with docker-compose
            # docker-compose --env-file .env up -d --build

            # # Remove the temporary .env file
            # rm .env
          '
