name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SERVER_SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          name: id_rsa # Это имя файла для ключа
          if_key_exists: replace # Заменить существующий ключ, если он есть

      - name: Deploy to VPS
        run: |
          ssh -v -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@***REMOVED*** 'cd /var/www/stickifyme && git pull origin master && docker-compose up -d --build'
